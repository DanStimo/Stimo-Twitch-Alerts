<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

.newspaper {
    position: absolute;
    right: 35px;
    bottom: 120px;
    width: 520px;
    max-height: 700px;
    padding: 26px 28px;
    box-sizing: border-box;

    background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.08)),
        rgba(224, 213, 185, 0.94);

    color: #111;
    font-family: Georgia, "Times New Roman", serif;

    border: 2px solid rgba(20,20,20,0.85);
    box-shadow:
        0 35px 90px rgba(0,0,0,0.75),
        inset 0 0 45px rgba(0,0,0,0.16);

    transform: rotate(0.8deg);
    filter: contrast(0.96);
}

.newspaper::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.13;
    background-image:
        radial-gradient(rgba(0,0,0,0.5) 0.6px, transparent 0.7px);
    background-size: 4px 4px;
}

.newspaper::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(0,0,0,0.42);
    pointer-events: none;
}

.paper-title {
    position: relative;
    text-align: center;
    font-size: 34px;
    line-height: 0.95;
    font-weight: 900;
    border-bottom: 3px double #111;
    padding-bottom: 10px;
    z-index: 2;
}

.paper-date {
    position: relative;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    margin: 8px 0 12px;
    text-transform: uppercase;
    z-index: 2;
}

.paper-section {
    position: relative;
    background: #111;
    color: #eee;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 5px;
    margin-bottom: 12px;
    text-transform: uppercase;
    z-index: 2;
}

#stories {
    position: relative;
    z-index: 2;
}

.story {
    border-bottom: 1px solid rgba(0,0,0,0.36);
    padding: 6px 0;
}

.story:first-child {
    padding-top: 2px;
    padding-bottom: 11px;
    border-bottom: 2px solid rgba(0,0,0,0.7);
}

.story:first-child .headline {
    font-size: 24px;
    line-height: 0.96;
}

.story:first-child .copy {
    font-size: 12px;
}

.headline {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.04;
}

.copy {
    margin-top: 4px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    line-height: 1.25;
}

.meta {
    margin-top: 3px;
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.68;
}

.empty {
    text-align: center;
    font-size: 15px;
    margin-top: 25px;
}

.stats-box {
    margin-top: 10px;
    margin-bottom: 8px;

    border-top: 2px solid rgba(0,0,0,0.65);
    border-bottom: 2px solid rgba(0,0,0,0.65);

    padding: 6px 0;

    font-family: Arial, sans-serif;
    font-size: 9px;
    line-height: 1.4;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.stats-title {
    font-weight: 900;
    margin-bottom: 4px;
}

.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 12px;
}

.footer-line {
    position: relative;
    z-index: 2;
    margin-top: 12px;
    padding-top: 7px;
    border-top: 3px double rgba(0,0,0,0.7);
    display: flex;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* Vertical scene positioning */
@media (max-aspect-ratio: 0.8) {
    .newspaper {
        right: 52px;
        bottom: 255px;
        width: 460px;
        max-height: 720px;
        transform: rotate(0.8deg);
    }
}

.newspaper::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background:
        radial-gradient(circle at 18% 22%, rgba(90,55,20,0.18), transparent 18%),
        radial-gradient(circle at 82% 74%, rgba(60,35,12,0.14), transparent 20%),
        linear-gradient(90deg, transparent 48%, rgba(0,0,0,0.08) 50%, transparent 52%),
        repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.035) 0px,
            rgba(0,0,0,0.035) 1px,
            transparent 2px,
            transparent 5px
        );
    mix-blend-mode: multiply;
    z-index: 3;
}

.newspaper::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(0,0,0,0.42);
    pointer-events: none;
    z-index: 4;
}

.featured-viewer {
    margin-top: 6px;
    padding: 5px 0;
    border-top: 2px solid rgba(0,0,0,0.65);
    border-bottom: 2px solid rgba(0,0,0,0.65);
    text-align: center;
}

.featured-label {
    font-family: Arial, sans-serif;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.featured-name {
    margin-top: 2px;
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
}

.featured-reason {
    margin-top: 2px;
    font-family: Arial, sans-serif;
    font-size: 8px;
    line-height: 1.25;
}
</style>
</head>

<body>

<div class="newspaper">
    <div class="paper-title">Los Santos Gazette</div>
    <div class="paper-date" id="paperDate"></div>
    <div class="paper-section">Final Edition</div>
    <div id="stories"></div>

    <div id="statsBox" class="stats-box"></div>
    <div id="featuredViewer" class="featured-viewer"></div>

    <div class="footer-line">
        <span>Stay Alert</span>
        <span>Stay Safe</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const storiesEl = document.getElementById("stories");
const paperDate = document.getElementById("paperDate");

let sessionAlerts = [];

function updateEditionInfo() {

    const edition =
        String(sessionAlerts.length)
        .padStart(3, "0");

    paperDate.textContent =
        `VOL. ${edition} • ` +
        new Date().toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
}

function cleanName(value) {
    return String(value || "Unknown Viewer").trim();
}

function cleanUpper(value) {
    return cleanName(value).toUpperCase();
}

function stripGiftName(value) {
    return cleanName(value)
        .replace(/\s*◆\s*/g, " to ")
        .replace(/\s+/g, " ");
}

function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function headlineFor(alert) {
    const user = cleanName(alert.user);
    const upper = cleanUpper(alert.user);
    const extra = cleanName(alert.extra);
    const reward = cleanName(alert.reward);

    if (alert.type === "follow") {
        return {
            headline: randomFrom([
                "NEW FACE SPOTTED IN THE CITY",
                "ANOTHER WITNESS ENTERS LOS SANTOS",
                "CITY RECORDS NEW ARRIVAL"
            ]),
            copy: "Another viewer arrived during tonight's coverage as the city continued to move around them.",
            meta: user
        };
    }

    if (alert.type === "sub") {
        return {
            headline: randomFrom([
                "LOCAL SUPPORTER BACKS THE PRESS",
                "NEWSROOM RECEIVES MONTHLY SUPPORT",
                "COVERAGE FUNDED FOR ANOTHER NIGHT"
            ]),
            copy: "The Gazette confirms another supporter helped keep the cameras rolling.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "primesub") {
        return {
            headline: randomFrom([
                "PRIME SUPPORTER FUNDS THE NEWSROOM",
                "LOCAL PRESS RECEIVES PRIME BACKING",
                "BROADCAST RECEIVES PRIME SUPPORT"
            ]),
            copy: "A Prime subscription was logged by the newsroom during the final edition.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "giftsub") {
        const isBulk =
            !reward ||
            upper.includes("GIFTED X") ||
            extra.toUpperCase().includes("GIFT SUBS");

        if (isBulk) {
            return {
                headline: randomFrom([
                    "COMMUNITY ACCESS EXPANDED",
                    "MULTIPLE PASSES ISSUED ACROSS THE CITY",
                    "SUPPORTER OPENS DOORS FOR THE CROWD"
                ]),
                copy: "Several new passes were issued during tonight's broadcast, according to newsroom records.",
                meta: `${user} • ${extra}`
            };
        }

        return {
            headline: randomFrom([
                "PRESS PASS TRANSFER RECORDED",
                "ONE VIEWER GRANTS ACCESS TO ANOTHER",
                "COMMUNITY PASS CHANGES HANDS"
            ]),
            copy: "A single gifted subscription was filed into the Gazette's end-of-night records.",
            meta: stripGiftName(user)
        };
    }

    if (alert.type === "raid") {
        return {
            headline: randomFrom([
                "LARGE CROWD GATHERS DOWNTOWN",
                "WITNESSES FLOOD INTO LOS SANTOS",
                "INCOMING CROWD JOINS LIVE COVERAGE"
            ]),
            copy: "A sudden wave of viewers arrived on scene before the final report was filed.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "bits") {
        return {
            headline: randomFrom([
                "DONATION LOGGED AT NEWS DESK",
                "FIELD REPORTING RECEIVES SUPPORT",
                "BROADCAST FUND RECEIVES CONTRIBUTION"
            ]),
            copy: "A bits contribution was recorded while the cameras remained live.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "tip") {
        return {
            headline: randomFrom([
                "TIP RECEIVED BY FIELD REPORTER",
                "LOCAL SUPPORTER FUNDS COVERAGE",
                "NEWS DESK CONFIRMS CONTRIBUTION"
            ]),
            copy: reward && reward !== "Unknown Viewer"
                ? reward
                : "A financial tip was filed as part of tonight's broadcast record.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "redemption") {
        return {
            headline: randomFrom([
                "PUBLIC REQUEST FILED",
                "VIEWER SUBMITS CITY NOTICE",
                "REQUEST ENTERED INTO PUBLIC RECORD"
            ]),
            copy: extra && extra !== "Unknown Viewer"
                ? extra
                : "A channel point redemption was added to tonight's public record.",
            meta: `${user} • ${reward}`
        };
    }

    return {
        headline: "NAME ADDED TO FINAL EDITION",
        copy: "Another viewer became part of tonight's story.",
        meta: user
    };
}

function buildSessionSummary() {
    const counts = {
        follow: 0,
        sub: 0,
        primesub: 0,
        giftsub: 0,
        bits: 0,
        raid: 0,
        tip: 0,
        totalBits: 0,
        totalRaidViewers: 0,
        giftedSubs: 0
    };

    sessionAlerts.forEach(alert => {
        counts[alert.type] = (counts[alert.type] || 0) + 1;

        if (alert.type === "bits") {
            counts.totalBits += parseInt(alert.extra, 10) || 0;
        }

        if (alert.type === "raid") {
            counts.totalRaidViewers += parseInt(alert.extra, 10) || 0;
        }

        if (alert.type === "giftsub") {
            const match = String(alert.extra || alert.user || "").match(/(\d+)/);
            counts.giftedSubs += match ? parseInt(match[1], 10) : 1;
        }
    });

    return counts;
}

function getFeaturedViewer() {
    if (!sessionAlerts.length) return null;

    const scores = {};

    sessionAlerts.forEach(alert => {
        const user = String(alert.user || "").replace(/\s*◆.*$/, "").trim();

        if (!user) return;

        if (!scores[user]) {
            scores[user] = {
                user,
                score: 0,
                reason: ""
            };
        }

        if (alert.type === "raid") {
            const viewers = parseInt(alert.extra, 10) || 0;
            scores[user].score += 50 + viewers;
            scores[user].reason = `Brought ${viewers} viewers into tonight's coverage.`;
        }

        if (alert.type === "giftsub") {
            const giftCount =
                parseInt(String(alert.extra || alert.user || "").match(/\d+/)?.[0], 10) || 1;

            scores[user].score += 40 + giftCount * 5;
            scores[user].reason = `Issued ${giftCount} press pass${giftCount === 1 ? "" : "es"} during the broadcast.`;
        }

        if (alert.type === "tip") {
            scores[user].score += 35;
            scores[user].reason = `Supported field reporting with ${alert.extra || "a tip"}.`;
        }

        if (alert.type === "bits") {
            const bits = parseInt(alert.extra, 10) || 0;
            scores[user].score += 20 + bits / 10;
            scores[user].reason = `Contributed ${bits} bit${bits === 1 ? "" : "s"} to the newsroom.`;
        }

        if (alert.type === "sub" || alert.type === "primesub") {
            scores[user].score += 25;
            scores[user].reason = "Backed the Gazette with a press pass.";
        }

        if (alert.type === "follow") {
            scores[user].score += 10;
            scores[user].reason = "Joined the story as a new witness.";
        }
    });

    return Object.values(scores)
        .sort((a, b) => b.score - a.score)[0];
}
    
function renderPaper() {
    storiesEl.innerHTML = "";
    updateEditionInfo();

    if (!sessionAlerts.length) {
        storiesEl.innerHTML =
            `<div class="empty">Waiting for tonight's first headline...</div>`;
        return;
    }

    const s = buildSessionSummary();

    const statsBox =
        document.getElementById("statsBox");
    
    statsBox.innerHTML = `
        <div class="stats-title">
            Tonight's Record
        </div>
    
        <div class="stats-grid">
            <div>${s.follow} Followers</div>
            <div>${s.sub + s.primesub} Subs</div>
    
            <div>${s.giftedSubs} Gifted Subs</div>
            <div>${s.totalRaidViewers} Raid Viewers</div>
    
            <div>${s.totalBits} Bits</div>
            <div>${s.tip} Tips</div>
        </div>
    `;

    const featuredViewer = document.getElementById("featuredViewer");
    const featured = getFeaturedViewer();
    
    if (featured) {
        featuredViewer.innerHTML = `
            <div class="featured-label">Person of the Edition</div>
            <div class="featured-name">${featured.user}</div>
            <div class="featured-reason">${featured.reason}</div>
        `;
    } else {
        featuredViewer.innerHTML = "";
    }

    const stories = [];

    if (s.raid > 0) {
        stories.push({
            headline: "CROWDS ARRIVE DURING LIVE COVERAGE",
            copy: `${s.raid} raid${s.raid === 1 ? "" : "s"} brought ${s.totalRaidViewers} viewer${s.totalRaidViewers === 1 ? "" : "s"} into the city tonight.`
        });
    }

    if (s.follow > 0) {
        stories.push({
            headline: "NEW RESIDENTS ARRIVE IN THE CITY",
            copy: `${s.follow} new follower${s.follow === 1 ? "" : "s"} joined the story before the final report was filed.`
        });
    }

    if (s.sub + s.primesub > 0) {
        stories.push({
            headline: "LOCAL SUPPORTERS BACK THE PRESS",
            copy: `${s.sub + s.primesub} subscription${s.sub + s.primesub === 1 ? "" : "s"} helped keep tonight's coverage on air.`
        });
    }

    if (s.giftsub > 0) {
        stories.push({
            headline: "PRESS PASSES DISTRIBUTED CITYWIDE",
            copy: `${s.giftedSubs} gifted subscription${s.giftedSubs === 1 ? "" : "s"} opened the door for more viewers across the city.`
        });
    }

    if (s.bits > 0) {
        stories.push({
            headline: "NEWS DESK RECEIVES FIELD SUPPORT",
            copy: `${s.totalBits} bit${s.totalBits === 1 ? "" : "s"} were contributed during tonight's broadcast.`
        });
    }

    if (s.tip > 0) {
        stories.push({
            headline: "TIPS FILED WITH THE NEWSROOM",
            copy: `${s.tip} tip${s.tip === 1 ? "" : "s"} were logged in support of field reporting.`
        });
    }

    stories.slice(0, 6).forEach(story => {
        const div = document.createElement("div");
        div.className = "story";

        div.innerHTML = `
            <div class="headline">${story.headline}</div>
            <div class="copy">${story.copy}</div>
        `;

        storiesEl.appendChild(div);
    });
}

function addAlert(data) {
    sessionAlerts.push(data);
    renderPaper();
}

socket.on("alert", addAlert);

fetch("/api/alert-session")
    .then(res => res.json())
    .then(history => {
        const all = [
            ...(history.follows || []).map(a => ({ ...a, type: "follow" })),
            ...(history.subs || []).map(a => ({ ...a, type: "sub" })),
            ...(history.primesubs || []).map(a => ({ ...a, type: "primesub" })),
            ...(history.giftsubs || []).map(a => ({ ...a, type: "giftsub" })),
            ...(history.bits || []).map(a => ({ ...a, type: "bits" })),
            ...(history.raids || []).map(a => ({ ...a, type: "raid" })),
            ...(history.tips || []).map(a => ({ ...a, type: "tip" }))
        ];

        sessionAlerts = all
            .filter(a => a && a.user)
            .sort((a, b) => new Date(a.time) - new Date(b.time));

        renderPaper();
    })
    .catch(() => renderPaper());

renderPaper();
</script>

</body>
</html>
