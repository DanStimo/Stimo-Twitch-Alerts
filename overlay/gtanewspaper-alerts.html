<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

.newspaper {
    position: absolute;
    right: 70px;
    bottom: 125px;
    width: 470px;
    max-height: 700px;
    padding: 26px 28px;
    box-sizing: border-box;

    background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.08)),
        rgba(224, 213, 185, 0.94);

    color: #111;
    font-family: Georgia, "Times New Roman", serif;

    border: 2px solid rgba(20,20,20,0.85);
    box-shadow:
        0 25px 70px rgba(0,0,0,0.65),
        inset 0 0 45px rgba(0,0,0,0.16);

    transform: rotate(1.1deg);
    filter: contrast(0.96);
}

.newspaper::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.13;
    background-image:
        radial-gradient(rgba(0,0,0,0.5) 0.6px, transparent 0.7px);
    background-size: 4px 4px;
}

.newspaper::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(0,0,0,0.42);
    pointer-events: none;
}

.paper-title {
    position: relative;
    text-align: center;
    font-size: 34px;
    line-height: 0.95;
    font-weight: 900;
    border-bottom: 3px double #111;
    padding-bottom: 10px;
    z-index: 2;
}

.paper-date {
    position: relative;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    margin: 8px 0 12px;
    text-transform: uppercase;
    z-index: 2;
}

.paper-section {
    position: relative;
    background: #111;
    color: #eee;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 5px;
    margin-bottom: 12px;
    text-transform: uppercase;
    z-index: 2;
}

#stories {
    position: relative;
    z-index: 2;
}

.story {
    border-bottom: 1px solid rgba(0,0,0,0.36);
    padding: 6px 0;
}

.story:first-child {
    padding-top: 2px;
    padding-bottom: 11px;
    border-bottom: 2px solid rgba(0,0,0,0.7);
}

.story:first-child .headline {
    font-size: 20px;
    line-height: 0.98;
}

.story:first-child .copy {
    font-size: 12px;
}

.headline {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.04;
}

.copy {
    margin-top: 4px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    line-height: 1.25;
}

.meta {
    margin-top: 3px;
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.68;
}

.empty {
    text-align: center;
    font-size: 15px;
    margin-top: 25px;
}

.footer-line {
    position: relative;
    z-index: 2;
    margin-top: 12px;
    padding-top: 7px;
    border-top: 3px double rgba(0,0,0,0.7);
    display: flex;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* Vertical scene positioning */
@media (max-aspect-ratio: 0.8) {
    .newspaper {
        right: 52px;
        bottom: 255px;
        width: 460px;
        max-height: 720px;
        transform: rotate(0.8deg);
    }
}
</style>
</head>

<body>

<div class="newspaper">
    <div class="paper-title">Los Santos Gazette</div>
    <div class="paper-date" id="paperDate"></div>
    <div class="paper-section">Final Edition</div>
    <div id="stories"></div>

    <div class="footer-line">
        <span>Stay Alert</span>
        <span>Stay Safe</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const storiesEl = document.getElementById("stories");
const paperDate = document.getElementById("paperDate");

let sessionAlerts = [];

paperDate.textContent =
    "End of Broadcast • " +
    new Date().toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

function cleanName(value) {
    return String(value || "Unknown Viewer").trim();
}

function cleanUpper(value) {
    return cleanName(value).toUpperCase();
}

function stripGiftName(value) {
    return cleanName(value)
        .replace(/\s*◆\s*/g, " to ")
        .replace(/\s+/g, " ");
}

function randomFrom(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function headlineFor(alert) {
    const user = cleanName(alert.user);
    const upper = cleanUpper(alert.user);
    const extra = cleanName(alert.extra);
    const reward = cleanName(alert.reward);

    if (alert.type === "follow") {
        return {
            headline: randomFrom([
                "NEW FACE SPOTTED IN THE CITY",
                "ANOTHER WITNESS ENTERS LOS SANTOS",
                "CITY RECORDS NEW ARRIVAL"
            ]),
            copy: "Another viewer arrived during tonight's coverage as the city continued to move around them.",
            meta: user
        };
    }

    if (alert.type === "sub") {
        return {
            headline: randomFrom([
                "LOCAL SUPPORTER BACKS THE PRESS",
                "NEWSROOM RECEIVES MONTHLY SUPPORT",
                "COVERAGE FUNDED FOR ANOTHER NIGHT"
            ]),
            copy: "The Gazette confirms another supporter helped keep the cameras rolling.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "primesub") {
        return {
            headline: randomFrom([
                "PRIME SUPPORTER FUNDS THE NEWSROOM",
                "LOCAL PRESS RECEIVES PRIME BACKING",
                "BROADCAST RECEIVES PRIME SUPPORT"
            ]),
            copy: "A Prime subscription was logged by the newsroom during the final edition.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "giftsub") {
        const isBulk =
            !reward ||
            upper.includes("GIFTED X") ||
            extra.toUpperCase().includes("GIFT SUBS");

        if (isBulk) {
            return {
                headline: randomFrom([
                    "COMMUNITY ACCESS EXPANDED",
                    "MULTIPLE PASSES ISSUED ACROSS THE CITY",
                    "SUPPORTER OPENS DOORS FOR THE CROWD"
                ]),
                copy: "Several new passes were issued during tonight's broadcast, according to newsroom records.",
                meta: `${user} • ${extra}`
            };
        }

        return {
            headline: randomFrom([
                "PRESS PASS TRANSFER RECORDED",
                "ONE VIEWER GRANTS ACCESS TO ANOTHER",
                "COMMUNITY PASS CHANGES HANDS"
            ]),
            copy: "A single gifted subscription was filed into the Gazette's end-of-night records.",
            meta: stripGiftName(user)
        };
    }

    if (alert.type === "raid") {
        return {
            headline: randomFrom([
                "LARGE CROWD GATHERS DOWNTOWN",
                "WITNESSES FLOOD INTO LOS SANTOS",
                "INCOMING CROWD JOINS LIVE COVERAGE"
            ]),
            copy: "A sudden wave of viewers arrived on scene before the final report was filed.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "bits") {
        return {
            headline: randomFrom([
                "DONATION LOGGED AT NEWS DESK",
                "FIELD REPORTING RECEIVES SUPPORT",
                "BROADCAST FUND RECEIVES CONTRIBUTION"
            ]),
            copy: "A bits contribution was recorded while the cameras remained live.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "tip") {
        return {
            headline: randomFrom([
                "TIP RECEIVED BY FIELD REPORTER",
                "LOCAL SUPPORTER FUNDS COVERAGE",
                "NEWS DESK CONFIRMS CONTRIBUTION"
            ]),
            copy: reward && reward !== "Unknown Viewer"
                ? reward
                : "A financial tip was filed as part of tonight's broadcast record.",
            meta: `${user} • ${extra}`
        };
    }

    if (alert.type === "redemption") {
        return {
            headline: randomFrom([
                "PUBLIC REQUEST FILED",
                "VIEWER SUBMITS CITY NOTICE",
                "REQUEST ENTERED INTO PUBLIC RECORD"
            ]),
            copy: extra && extra !== "Unknown Viewer"
                ? extra
                : "A channel point redemption was added to tonight's public record.",
            meta: `${user} • ${reward}`
        };
    }

    return {
        headline: "NAME ADDED TO FINAL EDITION",
        copy: "Another viewer became part of tonight's story.",
        meta: user
    };
}

function renderPaper() {
    storiesEl.innerHTML = "";

    const recent = sessionAlerts
        .filter(a => a && a.user)
        .slice(-5)
        .reverse();

    if (!recent.length) {
        storiesEl.innerHTML =
            `<div class="empty">Waiting for tonight's first headline...</div>`;
        return;
    }

    recent.forEach(alert => {
        const story = headlineFor(alert);

        const div = document.createElement("div");
        div.className = "story";

        div.innerHTML = `
            <div class="headline">${story.headline}</div>
            <div class="copy">${story.copy}</div>
            <div class="meta">${story.meta}</div>
        `;

        storiesEl.appendChild(div);
    });
}

function addAlert(data) {
    sessionAlerts.push(data);

    if (sessionAlerts.length > 40) {
        sessionAlerts = sessionAlerts.slice(-40);
    }

    renderPaper();
}

socket.on("alert", addAlert);
socket.on("new-alert", addAlert);

fetch("/api/alert-history")
    .then(res => res.json())
    .then(history => {
        const all = [
            ...(history.follows || []).map(a => ({ ...a, type: "follow" })),
            ...(history.subs || []).map(a => ({ ...a, type: "sub" })),
            ...(history.primesubs || []).map(a => ({ ...a, type: "primesub" })),
            ...(history.giftsubs || []).map(a => ({ ...a, type: "giftsub" })),
            ...(history.bits || []).map(a => ({ ...a, type: "bits" })),
            ...(history.raids || []).map(a => ({ ...a, type: "raid" })),
            ...(history.redemptions || []).map(a => ({ ...a, type: "redemption" })),
            ...(history.tips || []).map(a => ({ ...a, type: "tip" }))
        ];

        sessionAlerts = all
            .filter(a => a && a.user)
            .sort((a, b) => new Date(a.time) - new Date(b.time))
            .slice(-40);

        renderPaper();
    })
    .catch(() => {
        renderPaper();
    });

renderPaper();
</script>

</body>
</html>
