<!DOCTYPE html>
<html>
<head>

<style>

html,body{
margin:0;
overflow:hidden;
background:transparent;
font-family:Consolas,monospace;
}

#hud{
position:absolute;
inset:0;
pointer-events:none;
}

/* LEFT */

.left{
position:absolute;
left:30px;
top:180px;

display:flex;
flex-direction:column;
gap:18px;
}

/* RIGHT */

.right{
position:absolute;
right:30px;
top:180px;

display:flex;
flex-direction:column;
gap:18px;
}

.terminal{

position:relative;

width:90px;
height:72px;

overflow:hidden;

background:#07090d;

border-top:1px solid rgba(255,255,255,.08);
border-bottom:2px solid var(--c);

transition:
width .45s cubic-bezier(.2,.9,.2,1),
transform .45s cubic-bezier(.2,.9,.2,1),
box-shadow .35s;

box-shadow:
0 12px 24px rgba(0,0,0,.65);

}

/* left expands */

.left .terminal.active{

width:620px;

transform:translateX(30px);

}

/* right expands */

.right .terminal.active{

width:620px;

transform:translateX(-30px);

}

.grid{

position:absolute;
inset:0;

background:

linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);

background-size:18px 18px;

opacity:.4;

animation:gridMove 8s linear infinite;

}

@keyframes gridMove{

from{

background-position:0 0;

}

to{

background-position:80px 40px;

}

}

.scan{

position:absolute;

top:0;
left:-35%;

width:35%;
height:100%;

background:

linear-gradient(90deg,
transparent,
var(--c),
transparent);

opacity:.2;

animation:scan 3s linear infinite;

}

@keyframes scan{

from{

left:-40%;

}

to{

left:120%;

}

}

.title{

position:absolute;

top:8px;

left:14px;

font-size:10px;

letter-spacing:4px;

font-weight:900;

color:var(--c);

}

.value{

position:absolute;

left:14px;

bottom:10px;

font-size:18px;

font-weight:900;

opacity:1;

transition:opacity .3s;

}

.left .active .value{

opacity:.2;

}

.right .title{

right:14px;
left:auto;

}

.right .value{

right:14px;
left:auto;

text-align:right;

}

.large{

position:absolute;

top:18px;

left:130px;

font-family:Georgia;

font-size:34px;

font-weight:900;

opacity:0;

transform:translateY(10px);

transition:

opacity .3s,

transform .3s;

}

.active .large{

opacity:1;

transform:none;

}

.left .large{

text-align:left;

}

.right .large{

left:auto;
right:130px;

text-align:right;

}

.video{

position:absolute;

inset:0;

width:100%;
height:100%;

object-fit:cover;

opacity:0;

transition:opacity .35s;

filter:brightness(.45);

}

.active .video{

opacity:.3;

}

</style>

</head>

<body>

<div id="hud">

<div class="left">

<div class="terminal" id="follow" style="--c:#00d9ff">

<video class="video" muted loop playsinline></video>

<div class="grid"></div>

<div class="scan"></div>

<div class="title">FOLLOW</div>

<div class="value">

TESTFOLLOWER

</div>

<div class="large">

NEW FOLLOWER

</div>

</div>

<div class="terminal" id="sub" style="--c:#b84dff">

<video class="video" muted loop playsinline></video>

<div class="grid"></div>

<div class="scan"></div>

<div class="title">SUBS</div>

<div class="value">

TESTSUB

</div>

<div class="large">

PRESS PASS ISSUED

</div>

</div>

</div>

<div class="right">

<div class="terminal" id="tip" style="--c:#ffd44d">

<video class="video" muted loop playsinline></video>

<div class="grid"></div>

<div class="scan"></div>

<div class="title">

TIP

</div>

<div class="value">

£5.00

</div>

<div class="large">

COMMUNITY DONATION

</div>

</div>

<div class="terminal" id="bits" style="--c:#00ff99">

<video class="video" muted loop playsinline></video>

<div class="grid"></div>

<div class="scan"></div>

<div class="title">

BITS

</div>

<div class="value">

100

</div>

<div class="large">

PUBLIC SUPPORT

</div>

</div>

</div>

</div>

<script>

function test(id){

const t=document.getElementById(id);

t.classList.add("active");

setTimeout(()=>{

t.classList.remove("active");

},5000);

}

window.test=test;

</script>

</body>

</html>
