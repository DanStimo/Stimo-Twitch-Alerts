<!DOCTYPE html>
<html>
<head>
<title>GTA HUD V2</title>

<style>
:root {
    --accent: #00d9ff;
    --accent-soft: rgba(0,217,255,0.22);
    --accent-dark: rgba(0,217,255,0.08);
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Consolas, monospace;
}

#hud {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 1480px;
    height: 78px;
    pointer-events: none;
    color: white;
}

.hud-shell {
    position: absolute;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(90deg, rgba(0,0,0,0), var(--accent-dark), rgba(0,0,0,0)),
        linear-gradient(180deg, rgba(8,10,15,0.90), rgba(0,0,0,0.94));

    border-top: 1px solid rgba(255,255,255,0.12);
    border-bottom: 2px solid var(--accent);

    box-shadow:
        0 18px 50px rgba(0,0,0,0.75),
        0 0 34px var(--accent-soft),
        inset 0 0 40px rgba(255,255,255,0.035);

    clip-path: polygon(
        0 14px,
        18px 0,
        calc(100% - 18px) 0,
        100% 14px,
        100% calc(100% - 10px),
        calc(100% - 16px) 100%,
        16px 100%,
        0 calc(100% - 10px)
    );

    transition:
        height 0.55s cubic-bezier(.2,.9,.2,1),
        transform 0.55s cubic-bezier(.2,.9,.2,1),
        box-shadow 0.35s ease;
}

.hud-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 55%;
    opacity: 0;
    filter: brightness(0.55) contrast(1.15) saturate(0.9);
    z-index: 1;
    transition: opacity 0.45s ease;
}

.grid {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.45;

    background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);

    background-size: 28px 28px;
    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 160px 60px; }
}

.scanlines {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 0.35;
    background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.035) 0,
        rgba(255,255,255,0.035) 1px,
        transparent 2px,
        transparent 6px
    );
}

.sweep {
    position: absolute;
    top: 0;
    left: -30%;
    width: 25%;
    height: 100%;
    z-index: 4;

    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
    );

    opacity: 0.18;
    filter: blur(4px);
    animation: sweepMove 4.5s linear infinite;
}

@keyframes sweepMove {
    from { left: -30%; }
    to { left: 110%; }
}

.edge-runner {
    position: absolute;
    inset: 0;
    z-index: 9;
    opacity: 0.9;
}

.edge-runner::before,
.edge-runner::after {
    content: "";
    position: absolute;
    left: 0;
    width: 200%;
    height: 2px;

    background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 22px,
        var(--accent) 22px,
        var(--accent) 42px
    );

    animation: edgeRun 1.4s linear infinite;
}

.edge-runner::before { top: 0; }
.edge-runner::after {
    bottom: 0;
    animation-direction: reverse;
}

@keyframes edgeRun {
    from { transform: translateX(0); }
    to { transform: translateX(-180px); }
}

/* IDLE STATE */

.idle-layer {
    position: absolute;
    inset: 0;
    z-index: 8;

    display: grid;
    grid-template-columns: 160px 1fr 150px;
    align-items: center;

    opacity: 1;
    transform: translateY(0);
    transition:
        opacity 0.28s ease,
        transform 0.35s ease;
}

.live-panel {
    padding-left: 26px;
}

.live-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff3030;
    box-shadow:
        0 0 8px #ff3030,
        0 0 16px rgba(255,48,48,0.85);
    animation: livePulse 1.1s ease-in-out infinite;
}

@keyframes livePulse {
    0%,100% { opacity: .65; transform: scale(.85); }
    50% { opacity: 1; transform: scale(1.2); }
}

.live-text {
    font-size: 9px;
    letter-spacing: 3px;
    font-weight: 900;
    color: rgba(255,255,255,0.72);
}

#uptimeValue {
    margin-top: 5px;
    font-size: 17px;
    letter-spacing: 2px;
    font-weight: 900;
}

.readings {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
}

.reading {
    position: relative;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-left: 1px solid rgba(255,255,255,0.07);
}

.reading:last-child {
    border-right: 1px solid rgba(255,255,255,0.07);
}

.reading::before {
    content: "";
    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;
    width: 2px;
    background: var(--accent);
    opacity: 0.55;
}

.reading-label {
    font-size: 9px;
    letter-spacing: 3px;
    font-weight: 900;
    color: var(--accent);
}

.reading-value {
    margin-top: 7px;
    font-size: 15px;
    letter-spacing: 1px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.brand-panel {
    padding-right: 24px;
    text-align: right;
}

.brand-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.55);
    font-weight: 900;
}

.brand-main {
    margin-top: 5px;
    font-size: 16px;
    letter-spacing: 2px;
    font-weight: 900;
}

/* ALERT STATE */

.alert-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    opacity: 0;
    transform: translateY(-12px);
    transition:
        opacity 0.25s ease,
        transform 0.35s ease;
}

.alert-top {
    position: absolute;
    top: 12px;
    left: 32px;
    right: 32px;

    display: flex;
    justify-content: space-between;

    font-size: 10px;
    letter-spacing: 4px;
    font-weight: 900;
    color: var(--accent);
}

.alert-type {
    position: relative;
}

.alert-type::before {
    content: "►";
    margin-right: 10px;
}

.alert-status::after {
    content: " ◄";
}

.alert-main {
    position: absolute;
    top: 39px;
    left: 0;
    width: 100%;

    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 44px;
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;

    text-shadow:
        0 0 14px rgba(255,255,255,0.75),
        0 0 34px var(--accent);
}

.alert-detail {
    position: absolute;
    top: 92px;
    left: 0;
    width: 100%;

    text-align: center;
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: 900;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
}

.alert-meter {
    position: absolute;
    left: 34px;
    right: 34px;
    bottom: 14px;
    height: 4px;

    background: rgba(255,255,255,0.12);
    overflow: hidden;
}

.alert-meter-fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
}

/* ACTIVE ALERT */

#hud.alerting .hud-shell {
    height: 138px;
    transform: scaleX(1.012);
    box-shadow:
        0 22px 70px rgba(0,0,0,0.85),
        0 0 42px var(--accent-soft),
        inset 0 0 60px rgba(255,255,255,0.05);
    animation: shellKick 0.6s cubic-bezier(.2,.9,.2,1);
}

#hud.alerting .hud-video {
    opacity: 0.28;
}

#hud.alerting .idle-layer {
    opacity: 0;
    transform: translateY(14px);
}

#hud.alerting .alert-layer {
    opacity: 1;
    transform: translateY(0);
}

@keyframes shellKick {
    0% {
        transform: scaleX(.90) scaleY(.72);
        filter: blur(5px);
    }
    58% {
        transform: scaleX(1.03) scaleY(1.08);
        filter: blur(0);
    }
    100% {
        transform: scaleX(1.012) scaleY(1);
    }
}

/* HYPE TRAIN */
.train-strip {
    position: absolute;
    left: 165px;
    right: 165px;
    bottom: 0;

    height: 0;
    opacity: 0;

    z-index: 11;

    overflow: hidden;

    background:
        linear-gradient(90deg, transparent, rgba(184,77,255,0.24), transparent),
        rgba(0,0,0,0.62);

    border-top: 1px solid rgba(184,77,255,0.85);

    transition:
        height 0.35s ease,
        opacity 0.35s ease;
}

.train-strip.running {
    height: 18px;
    opacity: 1;
}

.train-glow {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at center, rgba(184,77,255,0.45), transparent 60%);
    opacity: 0.5;
}

.train-label {
    position: absolute;
    left: 12px;
    top: 4px;

    font-size: 8px;
    letter-spacing: 3px;
    font-weight: 900;

    color: #d79dff;
    text-transform: uppercase;
}

.train-main {
    position: absolute;
    right: 12px;
    top: 4px;

    display: flex;
    gap: 14px;

    font-size: 8px;
    letter-spacing: 2px;
    font-weight: 900;

    color: white;
    text-transform: uppercase;
}

.train-track {
    position: absolute;
    left: 105px;
    right: 210px;
    top: 7px;

    height: 4px;

    background: rgba(255,255,255,0.14);
    overflow: hidden;
}

.train-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #b84dff,
            #ffffff,
            #b84dff
        );

    box-shadow:
        0 0 10px rgba(184,77,255,0.9),
        0 0 20px rgba(184,77,255,0.55);

    transition: width 0.5s ease;
}
    
</style>
</head>

<body>

<div id="hud">
    <div class="hud-shell">

        <video class="hud-video" id="hudVideo" muted playsinline loop></video>

        <div class="grid"></div>
        <div class="scanlines"></div>
        <div class="sweep"></div>
        <div class="edge-runner"></div>

        <div class="train-strip" id="subTrain">
            <div class="train-glow"></div>
        
            <div class="train-label">HYPE TRAIN</div>
        
            <div class="train-main">
                <span id="trainCount">LVL 1</span>
                <span id="trainTimer">STANDING BY</span>
            </div>
        
            <div class="train-track">
                <div class="train-fill" id="trainFill"></div>
            </div>
        </div>
        
        <div class="idle-layer">
            <div class="live-panel">
                <div class="live-row">
                    <span class="live-dot"></span>
                    <span class="live-text">ON AIR</span>
                </div>
                <div id="uptimeValue">00:00:00</div>
            </div>

            <div class="readings">
                <div class="reading">
                    <div class="reading-label">FOLLOW</div>
                    <div class="reading-value" id="latestFollow">WAITING</div>
                </div>

                <div class="reading">
                    <div class="reading-label">SUB</div>
                    <div class="reading-value" id="latestSub">WAITING</div>
                </div>

                <div class="reading">
                    <div class="reading-label">RAID</div>
                    <div class="reading-value" id="latestRaid">WAITING</div>
                </div>

                <div class="reading">
                    <div class="reading-label">TIP</div>
                    <div class="reading-value" id="latestTip">WAITING</div>
                </div>

                <div class="reading">
                    <div class="reading-label">BITS</div>
                    <div class="reading-value" id="latestBits">WAITING</div>
                </div>
            </div>

            <div class="brand-panel">
                <div class="brand-label">BROADCAST</div>
                <div class="brand-main">SNN LIVE</div>
            </div>
        </div>

        <div class="alert-layer">
            <div class="alert-top">
                <span class="alert-type" id="alertType">COMMUNITY EVENT</span>
                <span class="alert-status">SIGNAL VERIFIED</span>
            </div>

            <div class="alert-main" id="alertMain">ALERT</div>
            <div class="alert-detail" id="alertDetail"></div>

            <div class="alert-meter">
                <div class="alert-meter-fill" id="alertMeterFill"></div>
            </div>
        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const hud = document.getElementById("hud");
const hudVideo = document.getElementById("hudVideo");

const latestFollow = document.getElementById("latestFollow");
const latestSub = document.getElementById("latestSub");
const latestRaid = document.getElementById("latestRaid");
const latestTip = document.getElementById("latestTip");
const latestBits = document.getElementById("latestBits");

const alertType = document.getElementById("alertType");
const alertMain = document.getElementById("alertMain");
const alertDetail = document.getElementById("alertDetail");
const alertMeterFill = document.getElementById("alertMeterFill");

const subTrain = document.getElementById("subTrain");
const trainCount = document.getElementById("trainCount");
const trainFill = document.getElementById("trainFill");
const trainTimer = document.getElementById("trainTimer");

const uptimeValue = document.getElementById("uptimeValue");

let streamStartTime = null;
let alertQueue = [];
let alertPlaying = false;

const alertColors = {
    follow: "#00d9ff",
    sub: "#b84dff",
    primesub: "#00a8ff",
    giftsub: "#ff4fd8",
    raid: "#ff5533",
    tip: "#ffdd66",
    bits: "#00ff99",
    redemption: "#ffffff"
};

const alertVideos = {
    follow: "assets/videos/GTAEnding.webm",
    sub: "assets/videos/GTAEnding.webm",
    primesub: "assets/videos/GTAEnding.webm",
    giftsub: "assets/videos/GTAEnding.webm",
    raid: "assets/videos/GTAEnding.webm",
    bits: "assets/videos/GTAEnding.webm",
    redemption: "assets/videos/GTAEnding.webm",
    tip: "assets/videos/GTAEnding.webm"
};

function hexToRgba(hex, alpha) {
    const clean = hex.replace("#", "");
    const r = parseInt(clean.substring(0, 2), 16);
    const g = parseInt(clean.substring(2, 4), 16);
    const b = parseInt(clean.substring(4, 6), 16);

    return `rgba(${r},${g},${b},${alpha})`;
}

function setAccent(type) {
    const color = alertColors[type] || "#00d9ff";

    document.documentElement.style.setProperty("--accent", color);
    document.documentElement.style.setProperty("--accent-soft", hexToRgba(color, 0.24));
    document.documentElement.style.setProperty("--accent-dark", hexToRgba(color, 0.08));
}

function formatGiftSubText(user, extra, reward) {
    const rawUser = String(user || "").trim();
    const rawExtra = String(extra || "").trim();

    if (/GIFTED\s+X?\d+/i.test(rawUser)) return rawUser;

    if (reward) {
        return `${rawExtra || rawUser.split("◆")[0].trim()} GIFTED X1`;
    }

    const countMatch = rawExtra.match(/(\d+)/) || rawUser.match(/(\d+)/);
    const count = countMatch ? countMatch[1] : "1";
    const gifter = rawUser.split("◆")[0].split("♦")[0].trim();

    return `${gifter} GIFTED X${count}`;
}

function getAlertText(data) {
    const user = (data.user || "UNKNOWN").toUpperCase();

    if (data.type === "follow") {
        return {
            type: "NEW FOLLOWER",
            main: user,
            detail: "JOINED THE LIVE BROADCAST"
        };
    }

    if (data.type === "sub") {
        return {
            type: "PRESS PASS ISSUED",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "primesub") {
        return {
            type: "PRIME PRESS ACCESS",
            main: user,
            detail: data.extra || "PRIME"
        };
    }

    if (data.type === "giftsub") {
        return {
            type: "COMMUNITY SUPPORT",
            main: formatGiftSubText(data.user, data.extra, data.reward),
            detail: "PRESS PASSES DISTRIBUTED"
        };
    }

    if (data.type === "raid") {
        return {
            type: "INCOMING RAID",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "tip") {
        return {
            type: "COMMUNITY DONATION",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "bits") {
        return {
            type: "PUBLIC CONTRIBUTION",
            main: user,
            detail: data.extra || ""
        };
    }

    return {
        type: "BROADCAST ALERT",
        main: user,
        detail: data.extra || data.reward || ""
    };
}

function updateIdleReadings(data) {
    if (data.type === "follow") {
        latestFollow.textContent = data.user;
    }

    if (data.type === "sub") {
        latestSub.textContent = `${data.user} • ${data.extra || ""}`;
    }

    if (data.type === "primesub") {
        latestSub.textContent = `${data.user} • PRIME`;
    }

    if (data.type === "giftsub") {
        latestSub.textContent = formatGiftSubText(data.user, data.extra, data.reward);
    }

    if (data.type === "raid") {
        latestRaid.textContent = `${data.user} • ${data.extra || ""}`;
    }

    if (data.type === "tip") {
        latestTip.textContent = `${data.user} • ${data.extra || ""}`;
    }

    if (data.type === "bits") {
        latestBits.textContent = `${data.user} • ${data.extra || ""}`;
    }
}

function queueAlert(data) {
    alertQueue.push(data);

    if (!alertPlaying) {
        playNextAlert();
    }
}

function playNextAlert() {
    if (!alertQueue.length) {
        alertPlaying = false;
        return;
    }

    alertPlaying = true;

    const data = alertQueue.shift();
    const duration = data.duration || 6500;
    const text = getAlertText(data);

    setAccent(data.type);
    updateIdleReadings(data);

    const videoPath = alertVideos[data.type];

    if (videoPath) {
        if (hudVideo.getAttribute("src") !== videoPath) {
            hudVideo.setAttribute("src", videoPath);
            hudVideo.load();
        }

        hudVideo.currentTime = 0;
        hudVideo.play().catch(() => {});
    }

    alertType.textContent = text.type;
    alertMain.textContent = text.main;
    alertDetail.textContent = text.detail;

    alertMeterFill.style.transition = "none";
    alertMeterFill.style.width = "0%";
    void alertMeterFill.offsetWidth;

    alertMeterFill.style.transition = `width ${duration}ms linear`;
    alertMeterFill.style.width = "100%";

    hud.classList.add("alerting");

    setTimeout(() => {
        hud.classList.remove("alerting");

        setTimeout(() => {
            hudVideo.pause();
            hudVideo.removeAttribute("src");
            hudVideo.load();

            setAccent("follow");

            alertPlaying = false;
            playNextAlert();
        }, 700);

    }, duration);
}

function loadFromHistory(history) {
    if ((history.follows || [])[0]) {
        latestFollow.textContent = history.follows[0].user;
    }

    if ((history.subs || [])[0]) {
        latestSub.textContent = history.subs[0].user + " • " + history.subs[0].extra;
    }

    if ((history.primesubs || [])[0]) {
        latestSub.textContent = history.primesubs[0].user + " • PRIME";
    }

    if ((history.giftsubs || [])[0]) {
        const gift = history.giftsubs[0];
        latestSub.textContent = formatGiftSubText(gift.user, gift.extra, gift.reward);
    }

    if ((history.raids || [])[0]) {
        latestRaid.textContent = history.raids[0].user + " • " + history.raids[0].extra;
    }

    if ((history.tips || [])[0]) {
        latestTip.textContent = history.tips[0].user + " • " + history.tips[0].extra;
    }

    if ((history.bits || [])[0]) {
        latestBits.textContent = history.bits[0].user + " • " + history.bits[0].extra;
    }
}

function updateStreamUptime() {
    if (!streamStartTime) {
        uptimeValue.textContent = "00:00:00";
        return;
    }

    const elapsed = Math.floor((Date.now() - streamStartTime) / 1000);

    const hours = String(Math.floor(elapsed / 3600)).padStart(2, "0");
    const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
    const seconds = String(elapsed % 60).padStart(2, "0");

    uptimeValue.textContent = `${hours}:${minutes}:${seconds}`;
}

setInterval(updateStreamUptime, 1000);
updateStreamUptime();

let serverSubTrainCount = 0;
let serverSubTrainEndsAt = 0;
let serverSubTrainInterval = null;
let hypeTrainProgress = 0;
let hypeTrainGoal = 1;

function updateSubTrainDisplay() {
    const remaining = Math.max(0, serverSubTrainEndsAt - Date.now());

    if (serverSubTrainCount <= 0 || remaining <= 0) {
        subTrain.classList.remove("running");
        trainCount.textContent = "LVL 0";
        trainFill.style.width = "0%";
        trainTimer.textContent = "STANDING BY";

        if (serverSubTrainInterval) {
            clearInterval(serverSubTrainInterval);
            serverSubTrainInterval = null;
        }

        return;
    }

    subTrain.classList.add("running");
    trainCount.textContent = `LVL ${serverSubTrainCount}`;

    const percent =
        Math.min(
            100,
            ((hypeTrainProgress || 0) / (hypeTrainGoal || 1)) * 100
        );

    trainFill.style.width = `${percent}%`;

    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);

    trainTimer.textContent =
        `LEVEL ${serverSubTrainCount} • ${mins}:${String(secs).padStart(2, "0")} REMAINING`;
}

socket.on("hype-train-update", (data) => {
    if (!data.active) {
        serverSubTrainCount = 0;
        hypeTrainProgress = 0;
        hypeTrainGoal = 1;
        serverSubTrainEndsAt = 0;
        updateSubTrainDisplay();
        return;
    }

    serverSubTrainCount = data.level || 0;
    hypeTrainProgress = data.progress || 0;
    hypeTrainGoal = data.goal || 1;
    serverSubTrainEndsAt = data.expiresAt ? new Date(data.expiresAt).getTime() : 0;

    updateSubTrainDisplay();

    if (serverSubTrainInterval) {
        clearInterval(serverSubTrainInterval);
    }

    if (serverSubTrainCount > 0 && serverSubTrainEndsAt > Date.now()) {
        serverSubTrainInterval =
            setInterval(updateSubTrainDisplay, 500);
    }
});

socket.on("stream-status", (data) => {
    if (data.live && data.startedAt) {
        streamStartTime = new Date(data.startedAt).getTime();
    } else {
        streamStartTime = null;
    }

    updateStreamUptime();
});

socket.on("alert", queueAlert);

fetch("/api/alert-history")
    .then(res => res.json())
    .then(loadFromHistory);
</script>
