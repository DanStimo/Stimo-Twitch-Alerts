<!DOCTYPE html>
<html>
<head>
<title>Card Pack Reveal</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#cardOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
}

#cardOverlay.show {
    display: flex;
}

.pack {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 372px;
    height: 519px;

    transform: translate(-50%, -50%) scale(0);

    animation:
        packIn 0.6s forwards,
        packShake 0.5s 1.1s infinite;

    filter:
        drop-shadow(0 0 25px rgba(0,180,255,0.5))
        drop-shadow(0 0 60px rgba(0,0,0,0.8));
}

.pack-body {
    position: absolute;
    inset: 28px 0;

    border-radius: 24px;

    overflow: hidden;

    background:
        radial-gradient(circle at 50% 35%,
            rgba(0,180,255,0.22),
            transparent 32%),

        linear-gradient(
            135deg,
            rgba(255,255,255,0.18),
            transparent 18%,
            rgba(255,255,255,0.08) 40%,
            transparent 62%
        ),

        linear-gradient(
            180deg,
            #131c28,
            #05070a 60%,
            #0c1320
        );

    border: 2px solid var(--scan-colour);

    box-shadow:
        inset 0 0 30px rgba(255,255,255,0.06),
        inset 0 0 60px rgba(0,180,255,0.1),
        0 0 22px var(--scan-colour);
}

.pack-body::before {
    content: "";

    position: absolute;
    inset: -40%;

    background:
        linear-gradient(
            120deg,
            transparent 35%,
            var(--scan-colour),
            transparent 65%
        );

    opacity: 0.75;

    filter:
        blur(4px)
        drop-shadow(0 0 10px var(--scan-colour))
        drop-shadow(0 0 25px var(--scan-colour));

    animation: packShine 2s linear infinite;
}

.pack-body::after {
    content: "";

    position: absolute;
    inset: 12px;

    border: 1px solid rgba(0,180,255,0.25);
    border-radius: 18px;
}

.pack-crimp {
    position: absolute;

    left: 12px;
    right: 12px;

    height: 42px;

    background:
        repeating-linear-gradient(
            90deg,
            #111 0px,
            #111 8px,
            #2f2f2f 8px,
            #2f2f2f 14px
        );

    border: 1px solid rgba(255,255,255,0.3);
}

.pack-crimp.top {
    top: 0;
    border-radius: 12px 12px 4px 4px;
}

.pack-crimp.bottom {
    bottom: 0;
    border-radius: 4px 4px 12px 12px;
}

.pack-brand {
    position: absolute;

    top: 50px;
    width: 100%;

    text-align: center;

    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;

    color: white;

    text-shadow:
        0 0 12px rgba(0,180,255,0.7);
}

.pack-subtitle {
    position: absolute;

    top: 95px;
    width: 100%;

    text-align: center;

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;

    color: rgba(255,210,90,0.9);
}

.pack-orbit {
    position: absolute;

    top: 145px;
    left: 50%;

    width: 180px;
    height: 180px;

    transform: translateX(-50%);

    border: 2px solid var(--scan-colour);
    border-radius: 50%;

    box-shadow:
        0 0 12px var(--scan-colour),
        inset 0 0 12px var(--scan-colour);
}

.pack-orbit::before {
    content: "";

    position: absolute;
    inset: 30px;

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
}

.pack-star {
    position: absolute;

    top: 200px;
    width: 100%;

    text-align: center;

    font-size: 72px;

    color: white;

    text-shadow:
        0 0 15px white,
        0 0 30px var(--scan-colour),
        0 0 60px var(--scan-colour);
}

.pack-title {
    position: absolute;

    top: 290px;
    width: 100%;

    text-align: center;

    font-size: 38px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: 3px;

    color: white;
}

.pack-footer {
    position: absolute;

    left: 24px;
    right: 24px;
    bottom: 30px;

    display: flex;
    justify-content: space-between;

    border-top: 1px solid rgba(0,180,255,0.3);

    padding-top: 12px;

    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;

    color: rgba(255,255,255,0.7);
}

.pack[data-rarity="common"] {
    --scan-colour: #b8b8b8;
}

.pack[data-rarity="uncommon"] {
    --scan-colour: #41ff7a;
}

.pack[data-rarity="rare"] {
    --scan-colour: #42a5ff;
}

.pack[data-rarity="epic"] {
    --scan-colour: #b84dff;
}

.pack[data-rarity="legendary"] {
    --scan-colour: #ffbf00;
}

@keyframes packShine {
    from {
        transform: translateX(-80%) rotate(15deg);
    }

    to {
        transform: translateX(80%) rotate(15deg);
    }
}

@keyframes packFlare {
    0% {
        opacity: 0;
        visibility: hidden;
        transform: scale(0);
        filter: blur(24px);
    }

    5% {
        visibility: visible;
    }

    35% {
        opacity: 1;
        visibility: visible;
        transform: scale(1.1);
        filter: blur(4px);
    }

    100% {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.8);
        filter: blur(18px);
    }
}

.card {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 372px;
    height: 519px;

    background: transparent;

    border: none;
    border-radius: 14px;

    display: none;
    overflow: hidden;

    transform: translate(-50%, -50%) scale(0) rotateY(180deg);
}

.card.reveal {
    display: block;
    animation: cardReveal 0.9s forwards;
}

.card img {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    filter:
        drop-shadow(0 0 14px white)
        drop-shadow(0 0 34px white);
}

.card-info {
    padding: 6px 0 10px;
    color: white;
    text-align: center;
}

.card-rarity {
    margin-top: 0;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.common {
    border-color: #b8b8b8;
    color: #b8b8b8;
}

.uncommon {
    border-color: #41ff7a;
    color: #41ff7a;
}

.rare {
    border-color: #42a5ff;
    color: #42a5ff;
}

.epic {
    border-color: #b84dff;
    color: #b84dff;
}

.legendary {
    border-color: #ffbf00;
    color: #ffbf00;
}

@keyframes packIn {
    to {
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes packShake {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }

    25% {
        transform: translate(-50%, -50%) scale(1.04) rotate(-2deg);
    }

    75% {
        transform: translate(-50%, -50%) scale(1.04) rotate(2deg);
    }
}

@keyframes cardReveal {
    to {
        transform: translate(-50%, -50%) scale(1) rotateY(0deg);
    }
}

.card.reveal {
    animation: cardPop 1s ease forwards, cardGlow 2s ease-in-out infinite;
}

.card::after {
    content: "";
    position: absolute;
    inset: -40%;
    background: linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,0.55),
        transparent 65%
    );

    transform: translateX(-120%) rotate(12deg);

    opacity: 0;
}

.card.reveal::after {
    animation: shineSweep 1.4s ease 0.4s forwards;
}

@keyframes cardPop {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotateY(180deg);
        filter: blur(8px);
    }

    60% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08) rotateY(0deg);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotateY(0deg);
        filter: blur(0);
    }
}

@keyframes shineSweep {

    0% {
        opacity: 0;
        transform: translateX(-120%) rotate(12deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateX(120%) rotate(12deg);
    }
}

@keyframes cardGlow {
    0%, 100% {
        box-shadow:
            0 0 22px currentColor,
            0 0 42px currentColor;
    }

    50% {
        box-shadow:
            0 0 38px currentColor,
            0 0 70px currentColor;
    }
}

@keyframes cardExit {

    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(720deg);
    }
}

.card.exit {
    animation: cardExit 1s ease forwards;
}

</style>
</head>

<body>

<div id="cardOverlay">
    <div class="pack" id="pack">

    <div class="pack-crimp top"></div>

    <div class="pack-body">

        <div class="pack-brand">STIMO</div>

        <div class="pack-subtitle">
            COLLECT • TRADE • EXPLORE
        </div>

        <div class="pack-orbit"></div>

        <div class="pack-star">✦</div>

        <div class="pack-title">
            STAR<br>
            CITIZEN<br>
            PACK
        </div>

        <div class="pack-footer">
            <span>1 CARD</span>
            <span>OPENING...</span>
        </div>

    </div>

    <div class="pack-crimp bottom"></div>

</div>

    <div class="card" id="card">
        <img id="cardImage">

        <div class="card-info">
            <div class="card-rarity" id="cardRarity"></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const packQueue = [];
let packPlaying = false;

const revealSound = new Audio("/assets/sounds/Pack Open.mp3");
const overlay = document.getElementById("cardOverlay");
const pack = document.getElementById("pack");
const card = document.getElementById("card");
const cardImage = document.getElementById("cardImage");
const cardName = document.getElementById("cardName");
const cardRarity = document.getElementById("cardRarity");

socket.on("card_pull", (data) => {
    packQueue.push(data);
    playNextPack();
});

function playNextPack() {
    if (packPlaying) return;
    if (packQueue.length === 0) return;

    packPlaying = true;

    const data = packQueue.shift();
    const pulledCard = data.card;

    overlay.classList.add("show");

    pack.style.display = "flex";
    card.className = "card " + pulledCard.rarity;
    pack.setAttribute("data-rarity", pulledCard.rarity);
    pack.classList.remove("flare");
    card.style.display = "none";

    cardImage.src = "/" + pulledCard.image;
    cardRarity.textContent = pulledCard.rarity;

    setTimeout(() => {

        pack.style.display = "none";
    
        card.style.display = "block";
        card.style.opacity = "1";
    
        void card.offsetWidth;
    
        revealSound.pause();
        revealSound.currentTime = 0;
        revealSound.play();
    
        card.classList.add("reveal");
    
    }, 2500);

    setTimeout(() => {
        card.classList.remove("reveal");
        card.classList.add("exit");
    }, 11000);

    setTimeout(() => {
        overlay.classList.remove("show");

        card.className = "card";
        card.style.display = "none";
        pack.style.display = "flex";

        packPlaying = false;
        playNextPack();
    }, 12500);
}
</script>

</body>
</html>
