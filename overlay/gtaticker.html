<!DOCTYPE html>
<html>
<head>
<title>Alert Ticker</title>

<style>
:root {
    --primary: #ffffff;
    --secondary: #7a7a7a;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Consolas, monospace;
}

#ticker::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 74px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.15) 0%,
            rgba(0,0,0,0.65) 40%,
            rgba(0,0,0,0.92) 100%
        );
        
    border-top: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
    box-shadow:
        inset 0 24px 40px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

    opacity: 0.55;

    pointer-events: none;

    z-index: 0;

    mask-image: linear-gradient(
        90deg,
        transparent 0%,
        black 4%,
        black 96%,
        transparent 100%
    );
}

#ticker {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100vw;
    height: 74px;

    overflow: hidden;

    background: transparent;
    backdrop-filter: none;
    border: none;
    
    transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        background 0.35s ease;

    color: white;

    z-index: 9999;
}

#ticker.alerting {
    border-color: rgba(255,255,255,0.32);

    box-shadow:
        0 0 10px rgba(255,255,255,0.08),
        0 0 20px rgba(255,255,255,0.05);
}

.track {
    position: absolute;
    bottom: 12px;
    height: 76px;
    z-index: 2;
    display: flex;
    align-items: center;
    white-space: nowrap;
    animation: tickerMove 75s linear infinite;
    opacity: 0.82;
    transition: opacity 0.35s ease;

    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
}

#ticker.alerting .track {
    opacity: 0;
}

.item {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;

    height: 76px;
    opacity: 0.85;

    margin-right: 90px;

    text-transform: uppercase;
    color: white;
}

.label {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 4px;

    margin-bottom: 3px;

    opacity: 0.9;
}

.ticker-name {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
}

.alert-banner {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    transform: translateX(110%);
    opacity: 0;

    background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 55%),
        linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);

    color: white;

    z-index: 5;
}

.alert-banner.show {
    animation:
        bannerIn 0.65s ease forwards,
        bannerPulse 2.5s ease-in-out 0.65s infinite;
}

.alert-content {
    position: relative;
    width: 100%;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 10px 40px;
    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,0.42),
            rgba(0,0,0,0.12) 70%,
            transparent
        );
}

.alert-type {
    color: var(--primary);

    font-size: 16px;
    letter-spacing: 6px;
    font-weight: 900;

    opacity: 1;

    text-shadow:
        0 0 8px var(--primary),
        0 0 18px var(--primary),
        0 0 28px rgba(0,0,0,0.9);
}

.alert-main {
    margin-top: 4px;
    margin-bottom: 2px;
    font-size: 28px;
    letter-spacing: 2px;
    line-height: 1;
    font-weight: 900;
    text-shadow:
        0 0 12px rgba(255,255,255,0.9),
        0 0 32px var(--primary);
}

.gift-layout {
    display: flex;
    align-items: center;
    justify-content: center;
}

.gift-name {
    min-width: 320px;
}

.gift-name.left {
    text-align: right;
}

.gift-name.right {
    text-align: left;
}

.gift-diamond {
    margin: 0 28px;

    color: var(--primary);

    text-shadow:
        0 0 12px var(--primary),
        0 0 22px var(--primary);
}
    
.alert-detail {
    margin-top: 2px;

    font-size: 15px;
    font-weight: 900;

    letter-spacing: 2px;

    color: rgba(255,255,255,0.95);

    text-shadow:
        0 0 8px rgba(255,255,255,0.8),
        0 0 18px var(--primary);
}

.alert-scan {
    position: absolute;
    top: 0;
    left: -22%;

    width: 18%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        var(--primary),
        transparent
    );

    opacity: 0.35;
}

.alert-scan.running {
    animation: alertSweepPingPong var(--scan-duration, 2.2s) ease-in-out forwards;
}

.banner-video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center center;

    opacity: 0.35;
    z-index: -1;
}

.top-hype-train {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 74px;

    box-sizing: border-box;
    padding: 10px 42px;

    display: grid;
    grid-template-columns: 260px 1fr 110px;
    align-items: center;
    gap: 28px;

    background:
        linear-gradient(180deg, rgba(35,0,55,.92), rgba(0,0,0,.88)),
        radial-gradient(circle at center, rgba(184,77,255,.28), transparent 65%);

    border-bottom: 2px solid #b84dff;

    color: white;
    text-transform: uppercase;

    opacity: 0;
    transform: translateY(-110%);

    pointer-events: none;
    z-index: 9999;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.top-hype-summary {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 74px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            180deg,
            rgba(60,40,0,.96),
            rgba(0,0,0,.92)
        ),
        radial-gradient(
            circle at center,
            rgba(255,212,77,.28),
            transparent 65%
        );

    border-bottom:2px solid #ffb300;

    opacity:0;
    transform:translateY(-110%);

    pointer-events:none;

    overflow: hidden;

    z-index:10001;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.top-hype-summary.show {
    opacity: 1;
    transform: translateY(0);
}

.top-summary-small{
    font-size:13px;
    letter-spacing:6px;
    font-weight:900;
    color:#ffd44d;
}

.top-summary-level{

    margin-top:2px;

    font-size:34px;

    font-weight:900;

    letter-spacing:4px;

    color:white;

    text-shadow:
        0 0 14px #ffd44d,
        0 0 28px #ffb300,
        0 0 46px rgba(255,212,77,.45);

}

.top-summary-thanks{

    margin-top:4px;

    font-size:11px;

    letter-spacing:5px;

    color:rgba(255,255,255,.82);

    font-weight:900;

}

.top-hype-summary::before{
    content:"";

    position:absolute;
    top:0;
    left:-35%;

    width:25%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,245,170,.95),
        transparent
    );

    opacity:0;

    transform:skewX(-22deg);

    pointer-events:none;
}

.top-hype-summary.show::before{
    animation:summaryGoldSweep 1.4s ease-out forwards;
}

@keyframes summaryGoldSweep{

    0%{
        left:-35%;
        opacity:0;
    }

    10%{
        opacity:.95;
    }

    80%{
        opacity:.95;
    }

    100%{
        left:120%;
        opacity:0;
    }

}

.top-hype-train.running {
    opacity: 1;
    transform: translateY(0);
}

.top-train-bg {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            rgba(255,255,255,.10) 45%,
            transparent 70%
        );

    transform: translateX(-120%);
    animation: topTrainSweep 2.4s linear infinite;
}

@keyframes topTrainSweep {
    from { transform: translateX(-120%); }
    to { transform: translateX(120%); }
}

.top-train-left,
.top-train-center,
.top-train-right {
    position: relative;
    z-index: 2;
}

.top-train-label {
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 900;
    color: #b84dff;
}

.top-train-level {
    margin-top: 4px;

    font-size: 24px;
    letter-spacing: 2px;
    font-weight: 900;

    text-shadow:
        0 0 10px #b84dff,
        0 0 22px #b84dff;
}

.top-train-meta {
    display: flex;
    justify-content: space-between;

    font-size: 9px;
    letter-spacing: 3px;
    font-weight: 900;

    color: rgba(255,255,255,.72);
}

.top-train-time,
.top-train-progress {
    width: 100%;
    height: 6px;

    margin-top: 6px;

    background: rgba(255,255,255,.12);
    overflow: hidden;

    box-shadow:
        inset 0 0 8px rgba(0,0,0,.75);
}

.top-train-time-fill {
    width: 100%;
    height: 100%;

    background:
        repeating-linear-gradient(
            45deg,
            #b84dff 0px,
            #b84dff 8px,
            rgba(255,255,255,.85) 8px,
            rgba(255,255,255,.85) 11px
        );

    background-size: 32px 32px;
    animation: topTrainCountdownMove .65s linear infinite;

    transition: width .5s linear;
}

@keyframes topTrainCountdownMove {
    from { background-position: 0 0; }
    to { background-position: 32px 0; }
}

.top-train-progress-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #b84dff,
            white,
            #b84dff
        );

    box-shadow:
        0 0 14px #b84dff,
        0 0 26px rgba(184,77,255,.5);

    transition: width .5s ease-out;
}

.top-train-right {
    text-align: right;

    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;

    color: white;

    text-shadow:
        0 0 10px #b84dff,
        0 0 22px #b84dff;
}
    
@keyframes tickerMove {
    from {
        transform: translate3d(0, 0, 0);
    }

    to {
        transform: translate3d(-50%, 0, 0);
    }
}

@keyframes bannerIn {
    from {
        transform: translateX(110%) scale(0.98);
        opacity: 0;
        filter: blur(6px);
    }

    to {
        transform: translateX(0) scale(1);
        opacity: 1;
        filter: blur(0);
    }
}

@keyframes bannerPulse {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.92;
    }
}

@keyframes alertSweepPingPong {
    0% {
        left: -22%;
    }

    25% {
        left: 104%;
    }

    50% {
        left: -22%;
    }

    75% {
        left: 104%;
    }

    100% {
        left: -22%;
    }
}

@keyframes bannerOut {
    from {
        opacity: 1;
        filter: blur(0);
    }

    to {
        opacity: 0;
        filter: blur(4px);
    }
}
    
</style>
</head>

<body>

<div class="top-hype-train" id="topHypeTrain">
    <div class="top-train-bg"></div>

    <div class="top-train-left">
        <div class="top-train-label">HYPE TRAIN ACTIVE</div>
        <div class="top-train-level" id="topTrainLevel">LVL 0</div>
    </div>

    <div class="top-train-center">
        <div class="top-train-meta">
            <span>NEXT LEVEL PROGRESS</span>
            <span id="topTrainTimer">STANDING BY</span>
        </div>

        <div class="top-train-time">
            <div class="top-train-time-fill" id="topTrainTimeFill"></div>
        </div>

        <div class="top-train-progress">
            <div class="top-train-progress-fill" id="topTrainFill"></div>
        </div>
    </div>

    <div class="top-train-right" id="topTrainPercent">0%</div>
</div>

<div class="top-hype-summary" id="topHypeSummary">
    <div class="top-summary-small">HYPE TRAIN COMPLETE</div>
    <div class="top-summary-level" id="topSummaryLevel">LEVEL 1</div>
    <div class="top-summary-thanks">THANK YOU FOR THE SUPPORT</div>
</div>

<div id="ticker">
    <div class="track" id="track"></div>

    <div class="alert-banner" id="alertBanner">
        <video class="banner-video" id="bannerVideo" muted playsinline loop>
            <source src="assets/videos/Alert.webm" type="video/webm">
        </video>
        <div class="alert-scan"></div>

        <div class="alert-content">
            <div class="alert-type" id="alertType"></div>
            <div class="alert-main" id="alertMain"></div>
            <div class="alert-detail" id="alertDetail"></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const ticker = document.getElementById("ticker");
const track = document.getElementById("track");
const alertBanner = document.getElementById("alertBanner");
const alertType = document.getElementById("alertType");
const alertMain = document.getElementById("alertMain");
const alertDetail = document.getElementById("alertDetail");
const bannerVideo = document.getElementById("bannerVideo");
const topHypeTrain = document.getElementById("topHypeTrain");
const topTrainLevel = document.getElementById("topTrainLevel");
const topTrainTimer = document.getElementById("topTrainTimer");
const topTrainFill = document.getElementById("topTrainFill");
const topTrainTimeFill = document.getElementById("topTrainTimeFill");
const topTrainPercent = document.getElementById("topTrainPercent");
const topHypeSummary = document.getElementById("topHypeSummary");
const topSummaryLevel = document.getElementById("topSummaryLevel");

const alertSounds = {
    follow: new Audio("assets/sounds/New Follower.mp3"),
    sub: new Audio("assets/sounds/New Subscriber.mp3"),
    primesub: new Audio("assets/sounds/New Subscriber.mp3"),
    giftsub: new Audio("assets/sounds/New Subscriber.mp3"),
    raid: new Audio("assets/sounds/New Raid.mp3"),
    bits: new Audio("assets/sounds/New Bits.mp3"),
    redemption: new Audio("assets/sounds/New Redemption.mp3"),
    tip: new Audio("assets/sounds/New Donation.mp3")
};

function playTickerSound(type) {
    const sound = alertSounds[type];

    if (!sound) return;

    sound.pause();
    sound.currentTime = 0;

    sound.play().catch(err => {
        console.log("Ticker sound failed:", err.message);
    });
}
    
const alertThemes = {
    follow: {
        primary: "#00d9ff",
        secondary: "#009dff"
    },

    sub: {
        primary: "#c48cff",
        secondary: "#9f5cff"
    },

    primesub: {
        primary: "#c48cff",
        secondary: "#9f5cff"
    },

    giftsub: {
        primary: "#c48cff",
        secondary: "#9f5cff"
    },

    raid: {
        primary: "#ff8a6b",
        secondary: "#ffb366"
    },

    bits: {
        primary: "#7fffc8",
        secondary: "#4ddba0"
    },

    redemption: {
        primary: "#d9d9d9",
        secondary: "#9a9a9a"
    },

    tip: {
        primary: "#ffe7a0",
        secondary: "#ffcc66"
    }
};

const alertVideos = {
    follow: "assets/videos/GTAEnding.webm",
    sub: "assets/videos/GTAEnding.webm",
    primesub: "assets/videos/GTAEnding.webm",
    giftsub: "assets/videos/GTAEnding.webm",
    raid: "assets/videos/GTAEnding.webm",
    bits: "assets/videos/GTAEnding.webm",
    redemption: "assets/videos/GTAEnding.webm",
    tip: "assets/videos/GTAEnding.webm"
};

let items = [];
const bannerQueue = [];
let bannerPlaying = false;

let topTrainLevelValue = 0;
let topTrainProgress = 0;
let topTrainGoal = 1;
let topTrainEndsAt = 0;
let topTrainStartedAt = 0;
let topTrainDuration = 0;
let topTrainInterval = null;
let topFinalLevel = 0;

function applyTheme(type) {
    const theme = alertThemes[type] || alertThemes.follow;

    document.documentElement.style.setProperty("--primary", theme.primary);
    document.documentElement.style.setProperty("--secondary", theme.secondary);

    return theme;
}

function getTickerLabel(data) {
    if (data.type === "follow") return "FOLLOW";
    if (data.type === "sub") return "SUB";
    if (data.type === "primesub") return "PRIME";
    if (data.type === "giftsub") return "GIFT SUB";
    if (data.type === "raid") return "RAID";
    if (data.type === "bits") return "BITS";
    if (data.type === "redemption") return "REDEEM";
    if (data.type === "tip") return "TIP";
    return "ALERT";
}

function getTickerText(data) {
    const user = (data.user || "UNKNOWN").toUpperCase();

    if (data.type === "sub") return `${user} • ${data.extra || ""}`;
    if (data.type === "primesub") return `${user} • PRIME`;
    if (data.type === "giftsub") return `${user}`;
    if (data.type === "raid") return `${user} • ${data.extra || ""}`;
    if (data.type === "bits") return `${user} • ${data.extra || ""}`;
    if (data.type === "redemption") return `${user} • ${data.reward || ""}`;
    if (data.type === "tip") return `${user} • ${data.extra || ""}`;

    return user;
}

function getBannerText(data) {
    const user = (data.user || "UNKNOWN").toUpperCase();

    if (data.type === "follow") {
        return {
            type: "NEW FOLLOWER",
            main: user,
            detail: "JOINED THE STORY"
        };
    }

    if (data.type === "sub") {
        return {
            type: "PRESS PASS ISSUED",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "primesub") {
        return {
            type: "PRIME PRESS ACCESS",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "giftsub") {

        if (!data.reward) {
            return {
                type: "PRESS PASSES ISSUED",
                main: user,
                detail: "COMMUNITY SUPPORT"
            };
        }

        const parts = user.split("◆");

        const left = (parts[0] || "").trim();
        const right = (parts[1] || "").trim();

        return {
            type: "PRESS PASS TRANSFER",
            main: `
                <div class="gift-layout">
                    <span class="gift-name left">${left}</span>
                    <span class="gift-diamond">◆</span>
                    <span class="gift-name right">${right}</span>
                </div>
            `,
            detail: "COMMUNITY SUPPORT"
        };
    }

    if (data.type === "tip") {
        return {
            type: "COMMUNITY DONATION",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "raid") {
        return {
            type: "A CROWD IS GATHERING",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "bits") {
        return {
            type: "PUBLIC CONTRIBUTION",
            main: user,
            detail: data.extra || ""
        };
    }

    if (data.type === "redemption") {
        return {
            type: "VIEWER REQUEST FILED",
            main: user,
            detail: data.reward || ""
        };
    }

    return {
        type: "ALERT",
        main: user,
        detail: ""
    };
}

function renderTicker() {
    track.innerHTML = "";

    if (items.length === 0) {
        items = [{
            label: "SYSTEM",
            text: "WAITING FOR ALERT DATA",
            primary: "#ffffff"
        }];
    }

    const doubled = [...items, ...items];

    doubled.forEach((item) => {
        const el = document.createElement("div");
        el.className = "item";

        el.innerHTML = `
            <span class="label" style="color:${item.primary}">
                ${item.label}
            </span>
            <span class="ticker-name">${item.text}</span>
        `;

        track.appendChild(el);
    });
}

function addTickerItem(data) {
    const theme = alertThemes[data.type] || alertThemes.follow;

    items.unshift({
        label: getTickerLabel(data),
        text: getTickerText(data),
        primary: theme.primary
    });

    items = items.slice(0, 10);

    renderTicker();
}

function queueBanner(data) {
    bannerQueue.push(data);
    playNextBanner();
}

function playNextBanner() {
    if (bannerPlaying) return;
    if (bannerQueue.length === 0) return;

    bannerPlaying = true;

    const data = bannerQueue.shift();
    const text = getBannerText(data);

    applyTheme(data.type);
    const bannerVideo = document.getElementById("bannerVideo");
    bannerVideo.currentTime = 0;
    bannerVideo.play().catch(() => {});
    playTickerSound(data.type);

    const videoPath = alertVideos[data.type] || alertVideos.follow;

    const videoPositions = {
        follow: "center 55%",
        sub: "center 55%",
        primesub: "center 55%",
        giftsub: "center 55%",
        raid: "center 55%",
        bits: "center 55%",
        redemption: "center 55%"
        
    };
    
    bannerVideo.style.objectPosition =
        videoPositions[data.type] || "center center";

    if (bannerVideo.getAttribute("src") !== videoPath) {
        bannerVideo.setAttribute("src", videoPath);
        bannerVideo.load();
    }
    
    bannerVideo.currentTime = 0;
    bannerVideo.play().catch(() => {});

    alertType.textContent = text.type;
    alertMain.innerHTML = text.main;
    alertDetail.textContent = text.detail;

    ticker.classList.add("alerting");
    
    const scan = document.querySelector(".alert-scan");
    scan.classList.remove("running");
    scan.style.opacity = "0.35";
    void scan.offsetWidth;
    
    alertBanner.classList.remove("show");
    void alertBanner.offsetWidth;
    alertBanner.classList.add("show");

    const bannerDuration = (data.duration || 5000) + 750;

    const scanDuration = Math.max(2200, bannerDuration - 900);
    scan.style.setProperty("--scan-duration", `${scanDuration}ms`);
    scan.classList.add("running");
    
    alertBanner.style.setProperty("--banner-duration", `${bannerDuration}ms`);

    setTimeout(() => {
        document.querySelector(".alert-scan").style.opacity = "0";
    }, bannerDuration - 1000);
    
    setTimeout(() => {
        alertBanner.style.animation = "bannerOut 0.65s ease forwards";
    }, bannerDuration - 650);
    
    setTimeout(() => {
        ticker.classList.remove("alerting");
        alertBanner.classList.remove("show");
        alertBanner.style.animation = "";
    
        addTickerItem(data);
    
        bannerPlaying = false;
        playNextBanner();
    }, bannerDuration);
}

function updateTopHypeTrain() {
    const remaining =
        Math.max(0, topTrainEndsAt - Date.now());

    if (
        topTrainLevelValue <= 0 ||
        remaining <= 0
    ) {
        topHypeTrain.classList.remove("running");

        topTrainLevel.textContent = "LVL 0";
        topTrainFill.style.width = "0%";
        topTrainTimeFill.style.width = "0%";
        topTrainTimer.textContent = "STANDING BY";
        topTrainPercent.textContent = "0%";

        if (topTrainInterval) {
            clearInterval(topTrainInterval);
            topTrainInterval = null;
        }

        return;
    }

    topHypeTrain.classList.add("running");

    topTrainLevel.textContent =
        `LVL ${topTrainLevelValue}`;

    topFinalLevel = topTrainLevelValue;

    const progressPercent =
        Math.min(
            100,
            ((topTrainProgress || 0) / (topTrainGoal || 1)) * 100
        );

    topTrainFill.style.width =
        `${progressPercent}%`;

    topTrainPercent.textContent =
        `${Math.round(progressPercent)}%`;

    const timePercent =
        topTrainDuration > 0
            ? Math.max(
                0,
                Math.min(
                    100,
                    (remaining / topTrainDuration) * 100
                )
            )
            : 100;

    topTrainTimeFill.style.width =
        `${timePercent}%`;

    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);

    topTrainTimer.textContent =
        `${mins}:${String(secs).padStart(2, "0")} REMAINING`;
}

socket.on("hype-train-update", (data) => {
    if (!data.active) {
        if (topFinalLevel > 0) {
            if (topTrainInterval) {
                clearInterval(topTrainInterval);
                topTrainInterval = null;
            }

            topSummaryLevel.textContent =
                `LEVEL ${topFinalLevel}`;

            topHypeTrain.classList.remove("running");
            topHypeSummary.classList.add("show");

            setTimeout(() => {
                topHypeSummary.classList.remove("show");

                topTrainLevelValue = 0;
                topTrainProgress = 0;
                topTrainGoal = 1;
                topTrainEndsAt = 0;
                topTrainStartedAt = 0;
                topTrainDuration = 0;
                topFinalLevel = 0;

                updateTopHypeTrain();

            }, 10000);

            return;
        }

        topTrainLevelValue = 0;
        topTrainProgress = 0;
        topTrainGoal = 1;
        topTrainEndsAt = 0;
        topTrainStartedAt = 0;
        topTrainDuration = 0;
        topFinalLevel = 0;

        updateTopHypeTrain();
        return;
    }

    topTrainLevelValue = data.level || 0;

    const newEndsAt =
        data.expiresAt
            ? new Date(data.expiresAt).getTime()
            : 0;

    if (newEndsAt !== topTrainEndsAt) {
        topTrainStartedAt = Date.now();
    }

    topTrainEndsAt = newEndsAt;

    topTrainProgress = data.progress || 0;
    topTrainGoal = data.goal || 1;

    if (!topTrainStartedAt || topTrainStartedAt > Date.now()) {
        topTrainStartedAt = Date.now();
    }

    topTrainDuration =
        Math.max(1, topTrainEndsAt - topTrainStartedAt);

    updateTopHypeTrain();

    if (topTrainInterval) {
        clearInterval(topTrainInterval);
    }

    if (
        topTrainLevelValue > 0 &&
        topTrainEndsAt > Date.now()
    ) {
        topTrainInterval =
            setInterval(updateTopHypeTrain, 500);
    }
});
    
socket.on("connect", () => {
    console.log("[TICKER] Connected to socket");
});
    
socket.on("alert", (data) => {
    queueBanner(data);
});

function testTrain() {

    const train = document.getElementById("topHypeTrain");

    train.classList.add("running");

    document.getElementById("topTrainLevel").textContent = "LVL 4";
    document.getElementById("topTrainTimer").textContent = "3:12 REMAINING";
    document.getElementById("topTrainFill").style.width = "72%";
    document.getElementById("topTrainTimeFill").style.width = "64%";
    document.getElementById("topTrainPercent").textContent = "72%";

    setTimeout(() => {
        train.classList.remove("running");
    }, 10000);

}

window.testTrain = testTrain;

fetch("/api/alert-history")
    .then(res => res.json())
    .then(history => {
        const pastAlerts = [];

        (history.follows || []).forEach(item => pastAlerts.push({ type: "follow", user: item.user, time: item.time }));
        (history.subs || []).forEach(item => pastAlerts.push({ type: "sub", user: item.user, extra: item.extra, time: item.time }));
        (history.primesubs || []).forEach(item => pastAlerts.push({ type: "primesub", user: item.user, extra: item.extra, time: item.time }));
        (history.giftsubs || []).forEach(item => pastAlerts.push({ type: "giftsub", user: item.user, extra: item.extra, reward: item.reward, time: item.time }));
        (history.bits || []).forEach(item => pastAlerts.push({ type: "bits", user: item.user, extra: item.extra, time: item.time }));
        (history.raids || []).forEach(item => pastAlerts.push({ type: "raid", user: item.user, extra: item.extra, time: item.time }));
        (history.redemptions || []).forEach(item => pastAlerts.push({ type: "redemption", user: item.user, reward: item.reward, time: item.time }));
        (history.tips || []).forEach(item => pastAlerts.push({ type: "tip", user: item.user, extra: item.extra, reward: item.reward, time: item.time }));

        items = [];

        pastAlerts
            .sort((a, b) => new Date(b.time) - new Date(a.time))
            .slice(0, 10)
            .reverse()
            .forEach(addTickerItem);

        renderTicker();
    });
</script>
