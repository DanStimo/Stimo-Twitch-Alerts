<!DOCTYPE html>
<html>
<head>
<title>Starting Screen</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050604;
    font-family: Consolas, monospace;
}

.screen {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;

    background:
        radial-gradient(circle at 72% 42%, rgba(255,135,32,.16), transparent 30%),
        radial-gradient(circle at 20% 55%, rgba(80,110,60,.16), transparent 35%),
        linear-gradient(135deg, #1a2117 0%, #070807 58%, #020302 100%);
}

.safe-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 130px;

    background: rgba(0,0,0,.72);
    border-top: 1px solid rgba(255,177,59,.22);
}

.sky-glow {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(to bottom, rgba(90,105,75,.28), transparent 42%),
        radial-gradient(circle at 55% 33%, rgba(255,170,70,.18), transparent 38%);
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size: 54px 54px;
    opacity: .3;
}

.scanlines {
    position: absolute;
    inset: 0;

    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,
        transparent 3px,
        transparent 6px
    );

    opacity: .12;
}

.corner {
    position: absolute;
    width: 90px;
    height: 90px;
    border-color: rgba(255,177,59,.55);
}

.tl {
    top: 40px;
    left: 40px;
    border-top: 3px solid;
    border-left: 3px solid;
}

.tr {
    top: 40px;
    right: 40px;
    border-top: 3px solid;
    border-right: 3px solid;
}

.bl {
    bottom: 170px;
    left: 40px;
    border-bottom: 3px solid;
    border-left: 3px solid;
}

.br {
    bottom: 170px;
    right: 40px;
    border-bottom: 3px solid;
    border-right: 3px solid;
}

.hud-top {
    position: absolute;
    top: 74px;
    left: 90px;
    right: 90px;

    display: flex;
    justify-content: space-between;

    color: #ffb13b;
    font-size: 13px;
    letter-spacing: 5px;
    font-weight: 900;
}

.panel {
    position: absolute;
    left: 120px;
    bottom: 260px;
    width: 720px;
}

.status {
    color: #ffb13b;
    font-size: 18px;
    letter-spacing: 8px;
    font-weight: 900;
    margin-bottom: 24px;
}

.title {
    color: white;
    font-size: 86px;
    line-height: .92;
    font-weight: 900;
    letter-spacing: 4px;

    text-shadow:
        0 0 12px rgba(255,255,255,.38),
        0 0 34px rgba(255,150,40,.25);
}

.subtitle {
    margin-top: 28px;
    color: rgba(255,255,255,.76);
    font-size: 21px;
    letter-spacing: 5px;
    font-weight: 900;
    line-height: 1.45;
}

.loading-box {
    margin-top: 42px;
    width: 560px;
    height: 46px;

    border-left: 4px solid #ffb13b;

    background:
        linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.45));

    box-shadow:
        inset 0 0 22px rgba(255,170,60,.08),
        0 0 22px rgba(255,140,40,.22);

    display: flex;
    align-items: center;
    padding-left: 22px;

    color: white;
    font-size: 18px;
    letter-spacing: 5px;
    font-weight: 900;
}
