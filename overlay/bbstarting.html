<!DOCTYPE html>
<html>
<head>
<title>BattleBit Starting Screen</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Consolas, monospace;
}

.screen {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.85)),
        radial-gradient(circle at 50% 35%, rgba(255,180,60,.18), transparent 35%),
        linear-gradient(135deg, #181818, #070707 65%);
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .35;
}

.scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        transparent 2px,
        transparent 5px
    );
    opacity: .18;
}

.top-bar {
    position: absolute;
    top: 70px;
    left: 80px;
    right: 80px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: #ffb13b;
    font-size: 18px;
    letter-spacing: 6px;
    font-weight: 900;
}

.title-block {
    position: absolute;
    left: 120px;
    bottom: 170px;
}

.small {
    color: #ffb13b;
    font-size: 22px;
    letter-spacing: 10px;
    font-weight: 900;
    margin-bottom: 18px;
}

.title {
    color: white;
    font-size: 92px;
    line-height: .9;
    font-weight: 900;
    letter-spacing: 4px;

    text-shadow:
        0 0 12px rgba(255,255,255,.35),
        0 0 28px rgba(255,160,40,.35);
}

.subtitle {
    margin-top: 26px;
    color: rgba(255,255,255,.75);
    font-size: 24px;
    letter-spacing: 5px;
    font-weight: 900;
}

.starting {
    margin-top: 46px;
    width: 520px;
    height: 46px;

    border-left: 4px solid #ffb13b;
    background: rgba(0,0,0,.55);

    display: flex;
    align-items: center;
    padding-left: 22px;

    color: white;
    font-size: 20px;
    letter-spacing: 5px;
    font-weight: 900;

    box-shadow:
        0 0 22px rgba(255,170,60,.35),
        inset 0 0 18px rgba(255,170,60,.08);
}

.dots::after {
    content: "";
    animation: dots 1.4s infinite;
}

@keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
    100% { content: ""; }
}

.soldier-box {
    position: absolute;
    right: 110px;
    bottom: 115px;

    width: 560px;
    height: 620px;

    border: 2px solid rgba(255,177,59,.35);
    background:
        linear-gradient(135deg, rgba(255,177,59,.12), transparent 45%),
        rgba(0,0,0,.38);

    box-shadow:
        0 0 45px rgba(255,177,59,.15),
        inset 0 0 50px rgba(255,255,255,.04);
}

.block-soldier {
    position: absolute;
    left: 120px;
    bottom: 60px;
    width: 310px;
    height: 430px;
}

.head {
    width: 120px;
    height: 95px;
    background: #cfcfcf;
    position: absolute;
    left: 95px;
    top: 0;
}

.helmet {
    width: 150px;
    height: 42px;
    background: #3f4a36;
    position: absolute;
    left: 80px;
    top: -18px;
}

.body {
    width: 220px;
    height: 190px;
    background: #3d4b35;
    position: absolute;
    left: 45px;
    top: 110px;
}

.vest {
    width: 170px;
    height: 145px;
    background: #222a20;
    position: absolute;
    left: 70px;
    top: 130px;
}

.arm-left,
.arm-right {
    width: 55px;
    height: 190px;
    background: #46563d;
    position: absolute;
    top: 120px;
}

.arm-left {
    left: 0;
    transform: rotate(14deg);
}

.arm-right {
    right: 0;
    transform: rotate(-14deg);
}

.leg-left,
.leg-right {
    width: 78px;
    height: 150px;
    background: #2f3c2d;
    position: absolute;
    top: 300px;
}

.leg-left {
    left: 65px;
}

.leg-right {
    right: 65px;
}

.gun {
    position: absolute;
    width: 310px;
    height: 28px;
    background: #111;
    left: -10px;
    top: 185px;
    box-shadow: 75px -10px 0 #222;
}

.warning {
    position: absolute;
    bottom: 58px;
    left: 80px;
    right: 80px;

    height: 22px;

    background: repeating-linear-gradient(
        45deg,
        #ffb13b 0 26px,
        #111 26px 52px
    );

    opacity: .95;
}

.corner {
    position: absolute;
    width: 90px;
    height: 90px;
    border-color: #ffb13b;
    opacity: .75;
}

.tl {
    top: 35px;
    left: 35px;
    border-top: 3px solid;
    border-left: 3px solid;
}

.tr {
    top: 35px;
    right: 35px;
    border-top: 3px solid;
    border-right: 3px solid;
}

.bl {
    bottom: 35px;
    left: 35px;
    border-bottom: 3px solid;
    border-left: 3px solid;
}

.br {
    bottom: 35px;
    right: 35px;
    border-bottom: 3px solid;
    border-right: 3px solid;
}
</style>
</head>

<body>
<div class="screen">

    <div class="grid"></div>
    <div class="scanlines"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="top-bar">
        <div>STIMO DEPLOYMENT SYSTEM</div>
        <div>127v127 READY</div>
    </div>

    <div class="title-block">
        <div class="small">BATTLEBIT REMASTERED</div>

        <div class="title">
            DEPLOYMENT<br>
            STARTING
        </div>

        <div class="subtitle">
            LOADOUT CHECK • SQUAD LINK • COMMS ONLINE
        </div>

        <div class="starting">
            STREAM STARTING<span class="dots"></span>
        </div>
    </div>

    <div class="soldier-box">
        <div class="block-soldier">
            <div class="helmet"></div>
            <div class="head"></div>
            <div class="body"></div>
            <div class="vest"></div>
            <div class="arm-left"></div>
            <div class="arm-right"></div>
            <div class="leg-left"></div>
            <div class="leg-right"></div>
            <div class="gun"></div>
        </div>
    </div>

    <div class="warning"></div>

</div>
</body>
</html>
