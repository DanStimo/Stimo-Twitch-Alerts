<!DOCTYPE html>
<html>
<head>
<title>Starting Screen</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050604;
    font-family: Consolas, monospace;
}

.screen {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;

    background:
        radial-gradient(circle at 72% 42%, rgba(255,135,32,.16), transparent 30%),
        radial-gradient(circle at 20% 55%, rgba(80,110,60,.16), transparent 35%),
        linear-gradient(135deg, #1a2117 0%, #070807 58%, #020302 100%);
}

.safe-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 130px;

    background: rgba(0,0,0,.72);
    border-top: 1px solid rgba(255,177,59,.22);
}

.sky-glow {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(to bottom, rgba(90,105,75,.28), transparent 42%),
        radial-gradient(circle at 55% 33%, rgba(255,170,70,.18), transparent 38%);
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

    background-size: 54px 54px;
    opacity: .3;
}

.scanlines {
    position: absolute;
    inset: 0;

    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,
        transparent 3px,
        transparent 6px
    );

    opacity: .12;
}

.corner {
    position: absolute;
    width: 90px;
    height: 90px;
    border-color: rgba(255,177,59,.55);
}

.tl {
    top: 40px;
    left: 40px;
    border-top: 3px solid;
    border-left: 3px solid;
}

.tr {
    top: 40px;
    right: 40px;
    border-top: 3px solid;
    border-right: 3px solid;
}

.bl {
    bottom: 170px;
    left: 40px;
    border-bottom: 3px solid;
    border-left: 3px solid;
}

.br {
    bottom: 170px;
    right: 40px;
    border-bottom: 3px solid;
    border-right: 3px solid;
}

.hud-top {
    position: absolute;
    top: 74px;
    left: 90px;
    right: 90px;

    display: flex;
    justify-content: space-between;

    color: #ffb13b;
    font-size: 13px;
    letter-spacing: 5px;
    font-weight: 900;
}

.panel {
    position: absolute;
    left: 120px;
    bottom: 260px;
    width: 720px;
}

.status {
    color: #ffb13b;
    font-size: 18px;
    letter-spacing: 8px;
    font-weight: 900;
    margin-bottom: 24px;
}

.title {
    color: white;
    font-size: 86px;
    line-height: .92;
    font-weight: 900;
    letter-spacing: 4px;

    text-shadow:
        0 0 12px rgba(255,255,255,.38),
        0 0 34px rgba(255,150,40,.25);
}

.subtitle {
    margin-top: 28px;
    color: rgba(255,255,255,.76);
    font-size: 21px;
    letter-spacing: 5px;
    font-weight: 900;
    line-height: 1.45;
}

.loading-box {
    margin-top: 42px;
    width: 560px;
    height: 46px;

    border-left: 4px solid #ffb13b;

    background:
        linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.45));

    box-shadow:
        inset 0 0 22px rgba(255,170,60,.08),
        0 0 22px rgba(255,140,40,.22);

    display: flex;
    align-items: center;
    padding-left: 22px;

    color: white;
    font-size: 18px;
    letter-spacing: 5px;
    font-weight: 900;
}

.loading-box span::after {
    content: "";
    animation: dots 1.4s infinite;
}

@keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
    100% { content: ""; }
}

.ambient-panel {
    position: absolute;
    right: 125px;
    top: 250px;

    width: 560px;
    height: 380px;

    border: 1px solid rgba(255,177,59,.28);

    background:
        linear-gradient(135deg, rgba(255,177,59,.08), rgba(0,0,0,.30)),
        rgba(0,0,0,.22);

    box-shadow:
        inset 0 0 35px rgba(255,177,59,.05),
        0 0 35px rgba(255,140,40,.08);
}

.ambient-panel::before {
    content: "TACTICAL LINK";
    position: absolute;
    top: 26px;
    left: 28px;

    color: #ffb13b;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight: 900;
}

.ambient-panel::after {
    content: "";
    position: absolute;
    inset: 56px 28px 28px 28px;

    background-image:
        linear-gradient(rgba(255,177,59,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,177,59,.07) 1px, transparent 1px);

    background-size: 42px 42px;
    opacity: .45;
}

.smoke {
    position: absolute;
    inset: -200px;

    background:
        radial-gradient(circle at 20% 70%, rgba(255,255,255,.07), transparent 18%),
        radial-gradient(circle at 65% 55%, rgba(255,255,255,.05), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,.06), transparent 18%);

    filter: blur(38px);
    animation: smokeMove 20s linear infinite;
}

@keyframes smokeMove {
    from { transform: translateX(-70px); }
    to { transform: translateX(90px); }
}

.dust {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle, rgba(255,177,59,.45) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,.16) 0 1px, transparent 2px);

    background-size: 360px 240px, 280px 200px;
    animation: dustDrift 18s linear infinite;
    opacity: .22;
}

@keyframes dustDrift {
    from { background-position: 0 0, 0 0; }
    to { background-position: 220px 120px, -180px 100px; }
}

.light-sweep {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            rgba(255,177,59,.05) 45%,
            transparent 70%
        );

    transform: translateX(-120%);
    animation: sweep 8s linear infinite;
}

@keyframes sweep {
    from { transform: translateX(-120%); }
    to { transform: translateX(120%); }
}

.vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at center, transparent 45%, rgba(0,0,0,.72) 100%);
}

</style>
</head>

<body>

<div class="screen">

    <div class="sky-glow"></div>
    <div class="grid"></div>
    <div class="smoke"></div>
    <div class="dust"></div>
    <div class="light-sweep"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="hud-top">
        <div>SQUAD LINK ONLINE</div>
        <div>127v127 READY</div>
    </div>

    <div class="panel">
        <div class="status">DEPLOYMENT STATUS</div>

        <div class="title">
            STREAM<br>
            STARTING
        </div>

        <div class="subtitle">
            LOADOUT CHECK • COMMS ONLINE • WAITING<br>
            FOR SQUAD
        </div>

        <div class="loading-box">
            <span>CONNECTING TO SERVER</span>
        </div>
    </div>

    <div class="ambient-panel"></div>

    <div class="safe-bottom"></div>

</div>

</body>
</html>
